name: debug-dtv-sources

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone CoreELEC
        run: |
          git clone --depth 1 https://github.com/CoreELEC/CoreELEC.git
          cd CoreELEC
          git checkout coreelec-22

      - name: Read CoreELEC paths
        run: |
          cd CoreELEC

          ARCH=aarch64 PROJECT=Amlogic-ce DEVICE=Amlogic-no . config/options

          echo "sources_dir=$SOURCES" >> $GITHUB_ENV
          echo "build_dir=$BUILD" >> $GITHUB_ENV

          echo "===== VARIABLES ====="
          echo "SOURCES=$SOURCES"
          echo "BUILD=$BUILD"

      - name: Inject fallback sources
        run: |
          mkdir -p "${{ env.sources_dir }}"
          rsync -av .github/sources/ "${{ env.sources_dir }}/"

      - name: Show dtv files found
        run: |
          echo "===== DTV FILES FOUND ====="

          find "${{ env.sources_dir }}" \
            \( -iname "*dtv*" -o -iname "*scan*" \) \
            | sort

      - name: Examine exact files
        run: |
          FILE="${{ env.sources_dir }}/dtv-scan-tables-2026-04-11-be35975ac877.tar.bz2"

          echo
          echo "===== FILE EXISTS? ====="

          if [ ! -f "$FILE" ]; then
            echo "NOT FOUND"
            exit 1
          fi

          ls -lh "$FILE"

          echo
          echo "===== FILE TYPE ====="
          file "$FILE"

          echo
          echo "===== REAL SHA256 ====="
          sha256sum "$FILE"

          echo
          echo "===== SHA256 FILE CONTENT ====="
          cat "${FILE}.sha256"

          echo
          echo "===== URL FILE CONTENT ====="
          cat "${FILE}.url"

      - name: Compare checksums
        run: |
          FILE="${{ env.sources_dir }}/dtv-scan-tables-2026-04-11-be35975ac877.tar.bz2"

          REAL_SHA=$(sha256sum "$FILE" | awk '{print $1}')
          EXPECTED_SHA=$(cat "${FILE}.sha256" | awk '{print $1}')

          echo "REAL     : $REAL_SHA"
          echo "EXPECTED : $EXPECTED_SHA"

          if [ "$REAL_SHA" = "$EXPECTED_SHA" ]; then
            echo "CHECKSUM MATCH"
          else
            echo "CHECKSUM MISMATCH"
            exit 1
          fi

      - name: Show first bytes
        run: |
          FILE="${{ env.sources_dir }}/dtv-scan-tables-2026-04-11-be35975ac877.tar.bz2"

          echo "===== FIRST 64 BYTES ====="
          xxd -l 64 "$FILE"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: dtv-debug
          path: ${{ env.sources_dir }}
